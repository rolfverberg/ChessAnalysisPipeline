name: Manually run tests with Pytest

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  matrix-test:
    name: Run ${{ matrix.env-name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env-name: utils
            env-file: tests/utils/environment.yml
            test-path: tests/utils
            source-path: '--cov=CHAP/utils/'
          - env-name: tomo
            env-file: CHAP/tomo/environment.yml
            test-path: tests/tomo/test_tomo.py
            source-path: '--cov=CHAP/tomo/'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          environment-file: ${{ matrix.env-file }}
          auto-activate: true
          auto-update-conda: true
          activate-environment: ${{ matrix.env-name }}
          conda-remove-defaults: true
          use-mamba: true

      - name: Update configuration with version (tag) name
        run: |
          sed -i "s/PACKAGE_VERSION/0.0.1/" setup.py
          sed -i "s/PACKAGE_VERSION/0.0.1/" CHAP/__init__.py
          cat setup.py

      - name: Install shared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pytest-cov
          pip install pytest-html

      - name: Install package
        run: |
          pip install -e .
          conda list

      - name: Test with Pytest
        run: |
          pytest ${{ matrix.test-path }} ${{ matrix.source-path }} --html=report.html --self-contained-html --cov-report=html
#        pytest tests --junitxml=junit/test-results.xml --cov=tests --cov-report=xml --cov-report=html
